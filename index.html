<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9816;</text></svg>">
    <title>AI Chess</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        /* Layered ambient gradient: a warm purple accent cone fades into a
           deep navy field, with a darker vignette at the edges to draw the
           eye toward the board. */
        background:
          radial-gradient(ellipse at 30% 0%, rgba(99, 102, 241, 0.18), transparent 55%),
          radial-gradient(ellipse at 70% 100%, rgba(20, 184, 166, 0.10), transparent 55%),
          radial-gradient(ellipse at 50% 50%, #1e1b3a 0%, #0f0d1f 70%, #07060f 100%);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e2e8f0;
        touch-action: manipulation; /* Disable double-tap zoom */
      }
      #app {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
