[project]
name = "chess-ai-training"
version = "0.1.0"
description = "Python training rig for the ai-chess browser app (PyTorch + CUDA)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "rich>=13",
    "plotext>=5.2",
    # python-chess: used by the Syzygy tablebase integration to adjudicate
    # cap-timeout games when total pieces <= the tablebase's max piece count.
    # Optional at runtime (gracefully degrades to 0-scored caps if no
    # tablebase files are installed), but pinned here so env setup installs
    # the library unconditionally.
    "chess>=1.10",
    # Live hardware telemetry on the dashboard (CPU util, RAM, GPU util,
    # VRAM, GPU temp). psutil is cross-platform; pynvml is NVIDIA-only
    # but imports gracefully (we just hide the GPU rows on non-CUDA).
    "psutil>=5.9",
    "pynvml>=11.5; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
