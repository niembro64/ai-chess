[package]
name = "chess_ai_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "chess_ai_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# MCTS uses a seeded RNG (Dirichlet noise at root, visit-count sampling).
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
